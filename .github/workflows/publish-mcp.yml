name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "MCP Registry server.json version to publish"
        required: true
        default: "0.1.6"
      publish_npm:
        description: "Publish the npm package before refreshing MCP Registry metadata"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP Registry metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Prepare npm publish auth
        run: |
          npm install -g npm@latest
          npm --version
          if [ -n "${NPM_TOKEN}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}" --userconfig "${NPM_CONFIG_USERCONFIG}"
            echo "Using NPM_TOKEN repository secret for npm publish."
          else
            echo "NPM_TOKEN is not configured; attempting npm trusted publishing via GitHub Actions OIDC."
            echo "If this fails, configure the npm package trusted publisher for SynapseNetworkAI/Synapse-Network-MCP-Server and workflow publish-mcp.yml."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate version metadata
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          SERVER_PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          if [ "${SERVER_VERSION}" != "${{ inputs.expected_version }}" ]; then
            echo "server.json version ${SERVER_VERSION} does not match expected ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          if [ "${SERVER_PACKAGE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "server.json package version ${SERVER_PACKAGE_VERSION} must match package.json ${PACKAGE_VERSION}" >&2
            exit 1
          fi
          if [ "${{ inputs.publish_npm }}" = "true" ] && [ "${SERVER_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "npm publishes require package.json, server.json, and expected versions to match ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Release readiness
        run: npm run release:readiness

      - name: Publish npm package
        if: ${{ inputs.publish_npm }}
        run: npm publish --access public --registry=https://registry.npmjs.org

      - name: Skip npm package publish
        if: ${{ !inputs.publish_npm }}
        run: |
          echo "Skipping npm publish; refreshing MCP Registry metadata for an already-published package version."
          SERVER_PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          npm view "@synapse-network-ai/mcp-server@${SERVER_PACKAGE_VERSION}" version --registry=https://registry.npmjs.org

      - name: Install MCP publisher
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate

      - name: Publish MCP Registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
