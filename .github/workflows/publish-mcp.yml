name: Publish MCP Server

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version to publish from package.json and server.json"
        required: true
        default: "0.1.4"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm and MCP Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Prepare npm publish auth
        run: |
          npm install -g npm@latest
          npm --version
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
            echo "Using NPM_TOKEN repository secret for npm publish."
          else
            echo "NPM_TOKEN is not configured; attempting npm trusted publishing via GitHub Actions OIDC."
            echo "If this fails, configure the npm package trusted publisher for SynapseNetworkAI/Synapse-Network-MCP-Server and workflow publish-mcp.yml."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate version metadata
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          SERVER_PACKAGE_VERSION="$(node -p "require('./server.json').packages[0].version")"
          if [ "${PACKAGE_VERSION}" != "${{ inputs.expected_version }}" ]; then
            echo "package.json version ${PACKAGE_VERSION} does not match expected ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          if [ "${SERVER_VERSION}" != "${PACKAGE_VERSION}" ] || [ "${SERVER_PACKAGE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "server.json versions must match package.json ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Release readiness
        run: npm run release:readiness

      - name: Publish npm package
        run: npm publish --access public --registry=https://registry.npmjs.org

      - name: Install MCP publisher
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate

      - name: Publish MCP Registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
