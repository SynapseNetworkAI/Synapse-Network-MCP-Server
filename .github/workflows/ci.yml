name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MCP package
        run: npm run verify:mcp

      - name: CLI smoke test
        run: npm run smoke:cli

      - name: Package dry run
        run: npm pack --dry-run

      - name: Quality gates
        run: npm run ci:quality
