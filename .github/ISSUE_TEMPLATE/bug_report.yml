name: Bug report
description: Report a reproducible problem with the SynapseNetwork MCP server.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not paste real Agent Keys, owner private keys, owner JWTs, provider secrets, admin credentials, or wallet seed phrases.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.22.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Cursor
        - Devin
        - LangChain or custom MCP client
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Synapse environment
      options:
        - staging
        - prod
        - custom Gateway URL
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the MCP tool name and sanitized inputs.
      placeholder: "1. Configure MCP server...\n2. Call discover_services...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      render: text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed or redacted all Agent Keys and credentials.
          required: true
        - label: I am not requesting owner/admin/provider/deposit/withdrawal capabilities for this MCP server.
          required: true
